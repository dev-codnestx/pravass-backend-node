name: CI/CD Pipeline
run-name: CI/CD • ${{ github.event_name }} • ${{ github.ref_name }}

on:
  push:
    branches:
      - master
      - development
      - 'release/sprint-*'
  create:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce-branch-naming:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          if [[ ! "$BRANCH_NAME" =~ ^(feature|bugfix|hotfix|release)/[a-z0-9]+([._-][a-z0-9]+)*$ ]] && [[ "$BRANCH_NAME" != "master" ]] && [[ "$BRANCH_NAME" != "development" ]]; then
            echo "Invalid branch name: $BRANCH_NAME"
            echo "Branch names must start with: feature/, bugfix/, hotfix/, release/"
            echo "Allowed long-lived branches: master, development"
            exit 1
          fi
          echo "Branch name is valid: $BRANCH_NAME"

  prevent-direct-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Block direct push to protected branches
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/master" || "$GITHUB_REF" == "refs/heads/development" ]]; then
            echo "Direct push to master or development is not allowed."
            exit 1
          fi
          echo "Push target is allowed: $GITHUB_REF"

  validate-commit-message:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Get last commit message
        run: echo "MESSAGE=$(git log -1 --pretty=format:'%s')" >> "$GITHUB_ENV"

      - name: Check commit message format
        run: |
          if [[ ! "$MESSAGE" =~ ^(feat|style|fix|refactor|chore)(\([a-z0-9._/-]+\))?!?:\ .+ ]]; then
            echo "Invalid commit message: $MESSAGE"
            echo "Commit message must start with: feat:, style:, fix:, refactor:, or chore:"
            exit 1
          fi
          echo "Commit message is valid: $MESSAGE"

  verify:
    runs-on: ubuntu-latest
    needs: [enforce-branch-naming, validate-commit-message]
    if: github.ref_name == 'master' || startsWith(github.ref_name, 'release/sprint-')
    environment:
      name: ${{ github.ref_name == 'master' && 'production' || 'staging' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund

      - name: Build
        run: npm run compile

  deploy:
    runs-on: ubuntu-latest
    needs: [enforce-branch-naming, validate-commit-message, verify]
    if: github.event_name == 'push' && (github.ref_name == 'master' || startsWith(github.ref_name, 'release/sprint-'))
    environment:
      name: ${{ github.ref_name == 'master' && 'production' || 'staging' }}
    env:
      BRANCH_NAME: ${{ github.ref_name }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_IP: ${{ secrets.SERVER_IP }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || secrets.SERVER_APP_PATH }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Validate deployment configuration
        run: |
          if [[ -z "$SERVER_USER" || -z "$SERVER_IP" || -z "$DEPLOY_PATH" ]]; then
            echo "Missing deployment configuration."
            echo "Required secrets: SERVER_USER, SERVER_IP, SSH_PRIVATE_KEY, RAZORPAY_KEY_SECRET, RAZORPAY_KEY_ID"
            echo "Required repository variable: DEPLOY_PATH (fallback: secret SERVER_APP_PATH)"
            exit 1
          fi

      - name: Add server to known hosts
        run: ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh "$SERVER_USER@$SERVER_IP" "BRANCH_NAME='$BRANCH_NAME' DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'EOSSH'
            set -eu

            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi

            cd "$DEPLOY_PATH"
            git fetch --prune origin
            git reset --hard "origin/$BRANCH_NAME"
            git clean -fd

            npm ci
            npm run compile

            if [ "$BRANCH_NAME" = "master" ]; then
              ECOSYSTEM_FILE="ecosystem.config.json"
              LEGACY_PM2_NAME="app"
            elif [[ "$BRANCH_NAME" == release/sprint-* ]]; then
              ECOSYSTEM_FILE="ecosystem.stage.config.json"
              LEGACY_PM2_NAME="makanfy-backend"
            else
              echo "Unsupported deploy branch: $BRANCH_NAME"
              exit 1
            fi

            if [ ! -f "$ECOSYSTEM_FILE" ]; then
              echo "Missing ecosystem file: $ECOSYSTEM_FILE"
              exit 1
            fi

            PM2_TARGET_NAME="$(node -e 'const fs=require("fs"); const file=process.argv[1]; const cfg=JSON.parse(fs.readFileSync(file, "utf8")); const name=cfg?.apps?.[0]?.name; if(!name){process.exit(2)} process.stdout.write(name);' "$ECOSYSTEM_FILE")"

            if [ -z "$PM2_TARGET_NAME" ]; then
              echo "Could not resolve PM2 process name from $ECOSYSTEM_FILE"
              exit 1
            fi

            echo "Deploying PM2 app '$PM2_TARGET_NAME' using $ECOSYSTEM_FILE..."

            if pm2 describe "$PM2_TARGET_NAME" >/dev/null 2>&1; then
              pm2 reload "$PM2_TARGET_NAME" --update-env
            elif [ -n "$LEGACY_PM2_NAME" ] && pm2 describe "$LEGACY_PM2_NAME" >/dev/null 2>&1; then
              echo "Migrating PM2 process name from '$LEGACY_PM2_NAME' to '$PM2_TARGET_NAME'..."
              pm2 delete "$LEGACY_PM2_NAME" || true
              pm2 start "$ECOSYSTEM_FILE" --only "$PM2_TARGET_NAME"
            else
              pm2 start "$ECOSYSTEM_FILE" --only "$PM2_TARGET_NAME"
            fi

            pm2 save
            echo "Deployment successful for $PM2_TARGET_NAME."
          EOSSH
